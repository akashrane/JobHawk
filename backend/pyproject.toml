[project]
name = "jobhawk-backend"
version = "0.1.0"
description = "JobHawk AI Job Application Agent - Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.0",
    "litellm>=1.55.0",
    "jobspy>=0.31.0",
    "httpx>=0.27.0",
    "pdfplumber>=0.11.0",
    "sentence-transformers>=3.3.0",
    "supabase>=2.10.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "apscheduler>=3.10.0",
    "resend>=2.5.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.0",
    "html2text>=2024.2.26",
    "numpy>=1.26.0",
    "torch>=2.5.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
